name: tests

on:
    pull_request:
    push:
        branches:
            - main
            - master
            - codex/**

jobs:
    tests:
        runs-on: ubuntu-latest

        name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

        strategy:
            fail-fast: false
            matrix:
                php:
                    - "8.2"
                    - "8.3"
                    - "8.4"
                # testbench 10 is Laravel 12, testbench 11 is Laravel 13.
                testbench:
                    - "^10.0"
                    - "^11.0"
                include:
                    - testbench: "^10.0"
                      laravel: "12"
                    - testbench: "^11.0"
                      laravel: "13"
                # Laravel 13 needs PHP 8.3.
                exclude:
                    - php: "8.2"
                      testbench: "^11.0"

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

            - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

            - run: composer validate --strict
            - run: composer test
